[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "adapt-teledentistry"
version = "0.1.0"
description = "ADAPT multi-agent dental emergency triage"
requires-python = ">=3.11,<3.12"
dependencies = [
  "anthropic==0.34.2",
  "httpx==0.27.2",
  "numpy==2.1.1",
  "openai==1.44.1",
  "pandas==2.2.2",
  "pydantic==2.9.1",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.1",
  "scipy==1.14.1",
  "statsmodels==0.14.3",
  "typer==0.12.5"
]

[project.scripts]
adapt = "adapt_teledentistry.console:app"

[tool.hatch.build.targets.wheel]
packages = ["code/adapt_teledentistry"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
